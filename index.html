<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b4d3a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Familove</title>
    <script>
      // Apply a saved theme choice before first paint so there is no flash.
      try { var t = localStorage.getItem('familove.theme'); if (t) document.documentElement.dataset.theme = t } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
